backup:
  # backup retention in days
  retention: 6

# The public hostname of this OpenBao instance. Leave empty to disable the ingress.
service:
  hostname: ""
  ui: true

# The platform this instance runs on. Either `openshift` or `kubernetes`.
platform: openshift

'#sealSecret':
  export: false
sealSecret:
  # Enable one-time bootstrap job that creates the secret on install.
  enabled: true
  # Derived from the release name, the same expression is used for
  # openbao.server.extraSecretEnvironmentVars.
  name: "cel: claim.name + '-seal'"
  # Key used inside the secret data.
  key: SEAL_SECRET
  # Random value length generated by the job.
  length: 32
  job:
    image: quay.io/appuio/oc:v4.21
    imagePullPolicy: IfNotPresent

'#openbao':
  export: false
openbao:
  global:
    openshift: "cel: values.platform == 'openshift'"
  csi:
    enabled: false
    agent:
      enabled: false
  ui:
    enabled: "cel: values.service.ui"
  injector:
    enabled: false
  server:
    authDelegator:
      enabled: false
    updateStrategyType: RollingUpdate
    extraSecretEnvironmentVars: "cel: [{'envName': 'SEAL_SECRET', 'secretName': claim.name + '-seal', 'secretKey': values.sealSecret.key}]"
    # Ingress holds the configuration for the ingress.
    ingress:
      enabled: "cel: values.service.hostname != ''"
      className: "cel: values.platform == 'openshift' ? 'openshift-default' : 'nginx'"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      hosts: "cel: values.service.hostname == '' ? [] : [{'host': values.service.hostname}]"
      tls: "cel: values.service.hostname == '' ? [] : [{'hosts': [values.service.hostname], 'secretName': claim.name + '-tls'}]"
    ha:
      enabled: true
      raft:
        enabled: true
        config: |
          cel: r'''
          ui = %UI%

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          # Enable unauthenticated metrics access (necessary for Prometheus Operator)
          #telemetry {
          #  unauthenticated_metrics_access = "true"
          #}
          }

          storage "raft" {
            path = "/openbao/data"
          }

          service_registration "kubernetes" {}

          seal "static" {
            current_key_id = "20250606-1"
            current_key = "env://SEAL_SECRET"
          }

          initialize "audit" {
            request "enable-audit" {
              operation = "update"
              path = "sys/audit/stdout"
              data = {
                type = "file"
                options = {
                  file_path = "stdout"
                }
              }
            }
          }
          '''.replace('%UI%', string(values.service.ui))

    networkPolicy:
      enabled: false
